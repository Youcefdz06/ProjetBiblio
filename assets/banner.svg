<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ProjetBiblio</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ff8d2"/>
      <stop offset="55%" stop-color="#5aa9ff"/>
      <stop offset="100%" stop-color="#b48bff"/>
    </linearGradient>
    <linearGradient id="spine1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ff8d2"/>
      <stop offset="100%" stop-color="#1f7a8c"/>
    </linearGradient>
    <linearGradient id="spine2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5aa9ff"/>
      <stop offset="100%" stop-color="#2c5fb8"/>
    </linearGradient>
    <linearGradient id="spine3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b48bff"/>
      <stop offset="100%" stop-color="#6c3fb0"/>
    </linearGradient>
    <linearGradient id="spine4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd479"/>
      <stop offset="100%" stop-color="#c9862f"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3352"/>
      <stop offset="100%" stop-color="#1a2038"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

  <!-- faint shelf-plank texture across the whole banner -->
  <g stroke="#26304d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="95"  x2="1200" y2="95"/>
    <line x1="0" y1="205" x2="1200" y2="205"/>
  </g>

  <!-- faint oversized open-book watermark behind the title -->
  <g opacity="0.06" fill="#5aa9ff">
    <path d="M420 60 C 340 40 260 45 210 65 L210 260 C 260 240 340 235 420 255 Z"/>
    <path d="M420 60 C 500 40 580 45 630 65 L630 260 C 580 240 500 235 420 255 Z"/>
  </g>

  <g opacity="0.35">
    <circle cx="1080" cy="45" r="1.5" fill="#4ff8d2"/>
    <circle cx="1120" cy="80" r="1.5" fill="#5aa9ff"/>
    <circle cx="1150" cy="40" r="1.5" fill="#b48bff"/>
  </g>

  <text x="70" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#5aa9ff" opacity="0.75">~/library $ run --client</text>

  <text x="68" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="66" font-weight="700" fill="url(#title)">ProjetBiblio</text>

  <text x="70" y="188" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-style="italic" fill="#9aa7c7">A terminal library manager that actually respects your database credentials</text>

  <text x="70" y="222" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5f6c8a">// python client &#8226; fastapi server &#8226; turso db &#8226; ci-built windows exe</text>

  <line x1="70" y1="245" x2="640" y2="245" stroke="#2a3352" stroke-width="1"/>

  <!-- open book resting on the shelf -->
  <g transform="translate(870,150)">
    <path d="M60 8 C 40 -2 15 -4 0 4 L0 78 C 15 70 40 72 60 82 Z" fill="url(#page)" stroke="#3a4468" stroke-width="1"/>
    <path d="M60 8 C 80 -2 105 -4 120 4 L120 78 C 105 70 80 72 60 82 Z" fill="url(#page)" stroke="#3a4468" stroke-width="1"/>
    <line x1="60" y1="8" x2="60" y2="82" stroke="#4a5580" stroke-width="1.5"/>
    <g stroke="#4a5580" stroke-width="1" opacity="0.8">
      <line x1="10" y1="18" x2="52" y2="14"/>
      <line x1="10" y1="30" x2="52" y2="26"/>
      <line x1="10" y1="42" x2="52" y2="38"/>
      <line x1="68" y1="14" x2="110" y2="18"/>
      <line x1="68" y1="26" x2="110" y2="30"/>
      <line x1="68" y1="38" x2="110" y2="42"/>
    </g>
  </g>

  <!-- bookshelf: a proper row of spines, not bars -->
  <g transform="translate(945,205)">
    <rect x="0"   y="20" width="24" height="80" rx="3" fill="url(#spine1)"/>
    <rect x="0"   y="26" width="24" height="6"  fill="#0d1117" opacity="0.35"/>
    <rect x="30"  y="0"  width="24" height="100" rx="3" fill="url(#spine2)"/>
    <rect x="30"  y="8"  width="24" height="6"  fill="#0d1117" opacity="0.35"/>
    <rect x="60"  y="35" width="24" height="65" rx="3" fill="url(#spine3)"/>
    <rect x="60"  y="41" width="24" height="6"  fill="#0d1117" opacity="0.35"/>
    <rect x="90"  y="10" width="24" height="90" rx="3" fill="url(#spine4)"/>
    <rect x="90"  y="17" width="24" height="6"  fill="#0d1117" opacity="0.35"/>
    <rect x="120" y="28" width="24" height="72" rx="3" fill="url(#spine1)"/>
    <rect x="120" y="34" width="24" height="6"  fill="#0d1117" opacity="0.35"/>
    <rect x="-8" y="100" width="180" height="7" rx="2" fill="#2a3352"/>
  </g>
</svg>
